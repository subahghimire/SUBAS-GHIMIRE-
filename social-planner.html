<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Social Planner | Subas Ghimire</title><style>
:root{color-scheme:dark;--bg:#08090d;--panel:#12141c;--line:#ffffff22;--ink:#f7f7fb;--muted:#a6a8b3;--red:#e5253a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#8b111d24,transparent 38%),var(--bg);color:var(--ink);font:15px/1.6 Arial,"Noto Sans Devanagari",sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;background:#08090de8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:5}nav{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:white;text-decoration:none;font-weight:800;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:9px}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#ddd;text-decoration:none;font-size:11px}.head{padding:30px 0 18px}.eyebrow{font:700 10px monospace;letter-spacing:.15em;color:#ff8c97}.head h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}.head p{color:var(--muted);max-width:760px}.panel{background:linear-gradient(145deg,#171923,#0d0f15);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px;margin:10px 0}.field label{font:700 10px monospace;letter-spacing:.1em;color:#c6c8d1}.field input,.field textarea,.field select{width:100%;min-width:0;background:#090b11;color:white;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{border:1px solid #ffffff30;border-radius:999px;padding:10px 15px;background:linear-gradient(120deg,#b7192a,#e5253a);color:white;font-weight:700;font-size:11px;cursor:pointer}.btn.secondary{background:transparent}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted,.status{color:var(--muted);font-size:12px}.status{min-height:20px;color:#ff9da5}.item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#090b11}.item h3{margin:0 0 4px;font-size:15px}.item p{margin:4px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.item button{margin:5px 5px 0 0}.empty{padding:20px;text-align:center;color:var(--muted)}a{color:#ff9da5}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{padding-top:24px}.panel{padding:13px}.links{gap:8px}.links a{font-size:10px}}
</style></head><body><header><nav class="wrap"><a class="brand" href="creative-workspace.html">SUBAS GHIMIRE<small>CREATIVE NEWSROOM</small></a><div class="links"><a href="creative-workspace.html">All Tools</a><a href="index.html">Portfolio</a></div></nav></header><main class="wrap"><section class="head"><div class="eyebrow">PUBLISHING / CONTENT CALENDAR</div><h1>Social Media Planner</h1><p>Facebook, Instagram, TikTok र YouTube का पोस्ट योजना बनाएर स्थानीय क्यालेन्डरमा राख्नुहोस्। यो planner ले आफैँ पोस्ट प्रकाशित गर्दैन।</p></section>
<div class="panel"><div class="grid"><div class="field"><label>पोस्ट शीर्षक</label><input id="title" placeholder="पोस्टको विषय"></div><div class="field"><label>Platform</label><select id="platform"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>YouTube Shorts</option></select></div><div class="field"><label>योजना मिति र समय</label><input id="when" type="datetime-local"></div><div class="field"><label>Status</label><select id="state"><option>Planned</option><option>Ready</option><option>Published</option></select></div></div><div class="field"><label>Caption / Notes</label><textarea id="caption" placeholder="Caption, hashtags वा production notes"></textarea></div><div class="actions"><button class="btn" id="save">SAVE PLAN</button></div><p class="status" id="status" role="status"></p></div><section class="panel"><h2>Content Calendar</h2><div id="list" class="empty">योजना छैन।</div></section></main><script>(()=>{const $=id=>document.getElementById(id),key='sg_social_plan_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}function render(){const root=$('list');root.innerHTML='';data.sort((a,b)=>a.when.localeCompare(b.when));if(!data.length){root.className='empty';root.textContent='योजना छैन।';return}root.className='';data.forEach(d=>{const el=document.createElement('article');el.className='item';const h=document.createElement('h3');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.platform+' · '+new Date(d.when).toLocaleString()+' · '+d.state;const c=document.createElement('p');c.textContent=d.caption;const del=document.createElement('button');del.className='btn secondary';del.textContent='DELETE';del.onclick=()=>{data=data.filter(x=>x.id!==d.id);persist()};el.append(h,p,c,del);root.append(el)})}function persist(){try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='योजना सुरक्षित भयो।';render()}catch(e){$('status').textContent='Browser storage मा save गर्न सकिएन।'}}$('save').onclick=()=>{const title=$('title').value.trim(),when=$('when').value;if(!title||!when){$('status').textContent='शीर्षक र मिति आवश्यक छन्।';return}data.push({id:Date.now(),title,platform:$('platform').value,when,state:$('state').value,caption:$('caption').value.trim()});persist();$('title').value='';$('caption').value=''};render()})();</script></body></html>

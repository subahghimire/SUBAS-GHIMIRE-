<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>News Management | Subas Ghimire</title><style>
:root{color-scheme:dark;--bg:#08090d;--panel:#12141c;--line:#ffffff22;--ink:#f7f7fb;--muted:#a6a8b3;--red:#e5253a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#8b111d24,transparent 38%),var(--bg);color:var(--ink);font:15px/1.6 Arial,"Noto Sans Devanagari",sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;background:#08090de8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:5}nav{min-height:62px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:white;text-decoration:none;font-weight:800;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:9px}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#ddd;text-decoration:none;font-size:11px}.head{padding:30px 0 18px}.eyebrow{font:700 10px monospace;letter-spacing:.15em;color:#ff8c97}.head h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}.head p{color:var(--muted);max-width:760px}.panel{background:linear-gradient(145deg,#171923,#0d0f15);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px;margin:10px 0}.field label{font:700 10px monospace;letter-spacing:.1em;color:#c6c8d1}.field input,.field textarea,.field select{width:100%;min-width:0;background:#090b11;color:white;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{border:1px solid #ffffff30;border-radius:999px;padding:10px 15px;background:linear-gradient(120deg,#b7192a,#e5253a);color:white;font-weight:700;font-size:11px;cursor:pointer}.btn.secondary{background:transparent}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted,.status{color:var(--muted);font-size:12px}.status{min-height:20px;color:#ff9da5}.item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#090b11}.item h3{margin:0 0 4px;font-size:15px}.item p{margin:4px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.item button{margin:5px 5px 0 0}.empty{padding:20px;text-align:center;color:var(--muted)}a{color:#ff9da5}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{padding-top:24px}.panel{padding:13px}.links{gap:8px}.links a{font-size:10px}}
</style></head><body><header><nav class="wrap"><a class="brand" href="creative-workspace.html">SUBAS GHIMIRE<small>CREATIVE NEWSROOM</small></a><div class="links"><a href="creative-workspace.html">All Tools</a><a href="index.html">Portfolio</a></div></nav></header><main class="wrap"><section class="head"><div class="eyebrow">NEWSROOM / CONTENT DESK</div><h1>News Management System</h1><p>समाचार लेख्नुहोस्, सम्पादन गर्नुहोस् र Draft सुरक्षित राख्नुहोस्। अहिलेका Draft यसै ब्राउजरमा सुरक्षित हुन्छन्; server sync वा multi-device publishing उपलब्ध छैन।</p></section>
<div class="panel"><div class="grid"><div class="field"><label>शीर्षक</label><input id="title" maxlength="180" placeholder="समाचारको शीर्षक"></div><div class="field"><label>वर्ग</label><select id="category"><option>समाचार</option><option>राजनीति</option><option>अर्थतन्त्र</option><option>खेलकुद</option><option>मनोरञ्जन</option><option>स्थानीय</option></select></div></div><div class="field"><label>समाचार विवरण</label><textarea id="body" placeholder="तथ्य, स्रोत र विवरण लेख्नुहोस्…"></textarea></div><div class="field"><label>स्रोत / नोट</label><input id="source" placeholder="स्रोत लिंक वा सम्पादकीय नोट"></div><div class="actions"><button class="btn" id="save">SAVE DRAFT</button><button class="btn secondary" id="clear">CLEAR</button></div><p class="status" id="status" role="status"></p></div><section class="panel"><h2>Saved Drafts</h2><div id="list" class="empty">अहिलेसम्म Draft छैन।</div></section></main><script>(()=>{const key='sg_news_drafts_v1', $=id=>document.getElementById(id);let drafts=[];try{drafts=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(drafts))drafts=[]}catch(e){drafts=[]}function render(){const root=$('list');root.innerHTML='';if(!drafts.length){root.className='empty';root.textContent='अहिलेसम्म Draft छैन।';return}root.className='';drafts.forEach(d=>{const el=document.createElement('article');el.className='item';const h=document.createElement('h3');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.category+' · '+new Date(d.updated).toLocaleString();const b=document.createElement('p');b.textContent=d.body;const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='EDIT';edit.onclick=()=>{ $('title').value=d.title;$('category').value=d.category;$('body').value=d.body;$('source').value=d.source||'';$('save').dataset.edit=d.id;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='btn secondary';del.textContent='DELETE';del.onclick=()=>{drafts=drafts.filter(x=>x.id!==d.id);persist();render()};el.append(h,p,b,edit,del);root.append(el)})}function persist(){try{localStorage.setItem(key,JSON.stringify(drafts));$('status').textContent='Draft सुरक्षित भयो।'}catch(e){$('status').textContent='Browser storage भरिएको वा बन्द छ। पुराना Draft हटाएर प्रयास गर्नुहोस्।'}}$('save').onclick=()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body){$('status').textContent='शीर्षक र विवरण दुवै आवश्यक छन्।';return}const id=$('save').dataset.edit||String(Date.now());const d={id,title,body,category:$('category').value,source:$('source').value.trim(),updated:new Date().toISOString()};drafts=[d,...drafts.filter(x=>x.id!==id)];delete $('save').dataset.edit;persist();render()};$('clear').onclick=()=>{['title','body','source'].forEach(id=>$(id).value='');delete $('save').dataset.edit;$('status').textContent='फाराम खाली भयो।'};render()})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Page not found | Subas Ghimire</title>
<style>
:root{--bg:#06100c;--mint:#a4ffdc;--green:#00d6a0;--muted:#9cb1a5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(ellipse at 70% 15%,#00d6a018,transparent 40%),var(--bg);
  color:#f2fff8;font-family:"DM Sans",Arial,sans-serif;text-align:center}
.big{font:700 clamp(90px,22vw,190px)/0.9 Georgia,serif;color:var(--mint);letter-spacing:-6px;margin:0}
p{color:var(--muted);max-width:420px;margin:18px auto 30px;line-height:1.7;font-size:14px}
a{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border:1px solid var(--green);
  border-radius:5px;background:var(--green);color:#04120c;text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
a:hover{background:transparent;color:var(--mint)}
small{display:block;margin-top:34px;color:#5d7a6c;font-size:10px;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <p class="big">404</p>
  <p>This frame got cut from the timeline. The page you are looking for does not exist — or it was moved during an edit.</p>
  <a href="/">← Back to the portfolio</a>
  <small>Subas Ghimire · Video Editor</small>
</main>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06110d">
<title>Message sent | Subas Ghimire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#06100c;--green:#00d6a0;--mint:#a4ffdc;--white:#f2fff8;--muted:#9cb1a5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
  background:radial-gradient(ellipse at 72% 12%,#00d6a01c,transparent 42%),radial-gradient(ellipse at 10% 88%,#008b6318,transparent 40%),var(--bg);
  color:var(--white);font-family:"DM Sans",system-ui,sans-serif}
.card{width:min(560px,100%);border:1px solid #77ffca2b;border-radius:16px;padding:38px 32px;background:#0c1b1480;backdrop-filter:blur(8px)}
.tick{width:54px;height:54px;border-radius:50%;border:1px solid var(--green);display:grid;place-items:center;color:var(--green);font-size:24px;margin-bottom:22px}
h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0 0 12px;letter-spacing:-.5px}
h1 em{color:var(--green);font-style:normal}
p{color:var(--muted);line-height:1.65;margin:0 0 26px;font-size:15px}
a.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--green);border-radius:6px;
  color:var(--green);font:700 11px "Space Grotesk",sans-serif;letter-spacing:1.4px;text-decoration:none}
a.btn:hover{background:var(--green);color:#06100c}
.foot{margin:26px 0 0;font-size:12px;color:#5f7a6c;letter-spacing:.4px}
</style>
</head>
<body>
<main class="card">
  <div class="tick">✓</div>
  <h1>Message <em>received.</em></h1>
  <p>Thanks for reaching out — it landed in my inbox. I read everything myself and usually reply within a day. If it's urgent, call <a href="tel:+9779766454587" style="color:var(--green)">9766454587</a>.</p>
  <a class="btn" href="/">BACK TO THE PORTFOLIO ↗</a>
  <p class="foot">SUBAS GHIMIRE · VIDEO EDITOR · NEPAL</p>
</main>
<script>setTimeout(function(){location.href="/"},12000)</script>
</body>
</html>

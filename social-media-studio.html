<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><link rel="stylesheet" href="assets/studio.css?v=3"><style>:root{color-scheme:dark;--bg:#08090d;--line:#ffffff20;--ink:#f7f7fb;--muted:#a6a8b3;--red:#ed2638}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#8b111d24,transparent 38%),var(--bg);color:var(--ink);font:15px/1.6 'DM Sans',Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 26px));margin:auto}header{position:sticky;top:0;z-index:5;background:#08090de8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}nav{min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;letter-spacing:.12em;color:#fff;text-decoration:none}.brand small{display:block;font-size:9px;color:#aaa}.navlinks{display:flex;gap:12px;flex-wrap:wrap}.navlinks a{font-size:11px;color:#ddd;text-decoration:none}.head{padding:30px 0 18px}.eyebrow{font:700 10px ui-monospace,monospace;color:#ff858d;letter-spacing:.16em}.head h1{font-size:clamp(32px,5vw,52px);margin:8px 0}.head p,.muted,.hint{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#171923,#0d0f15);padding:15px;min-width:0}.panel h2{font:700 12px ui-monospace,monospace;letter-spacing:.1em;margin:0 0 12px}.field{display:grid;gap:6px;margin:11px 0}.field label{font:700 9px ui-monospace,monospace;letter-spacing:.12em;color:#c5c6d0}.field input,.field textarea,.field select{width:100%;min-width:0;border:1px solid #ffffff24;border-radius:8px;background:#090b11;color:#fff;padding:11px;font:14px 'DM Sans',Arial,sans-serif}.field input[type=color]{height:42px;padding:4px}.field textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #ed2638;border-radius:999px;padding:11px 14px;background:#ed2638;color:#fff;font:700 10px ui-monospace,monospace;cursor:pointer}.btn.secondary{background:transparent}.row{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:18px;color:#ff9ca5;font-size:10px}.result{white-space:pre-wrap;border:1px dashed var(--line);border-radius:9px;padding:13px;min-height:70px;color:#eee;font-size:12px}.stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#050609}.stage canvas{display:block;width:100%;height:auto}footer{padding:18px 0;color:#888;font-size:10px}@media(max-width:820px){.layout{grid-template-columns:1fr}}@media(max-width:560px){nav{align-items:flex-start;flex-direction:column;padding:12px 0}.navlinks{gap:9px}.wrap{width:calc(100% - 20px)}.panel{padding:11px}.two{gap:6px}}</style><meta name="description" content="Social media caption and hashtag helper"><title>Social Media Studio | Subas Ghimire</title></head><body><header><nav class="wrap"><a class="brand" href="creative-workspace.html">SUBAS GHIMIRE<small>SOCIAL MEDIA STUDIO</small></a><div class="navlinks"><a href="creative-workspace.html">All Tools</a><a href="news-post-studio.html">News Post</a><a href="index.html">Portfolio</a></div></nav></header><main class="wrap"><section class="head"><span class="eyebrow">FACEBOOK · INSTAGRAM · TIKTOK · SHORTS</span><h1>Social Media <span style="color:#ff6873">Studio.</span></h1><p>Platform अनुसार title, caption र hashtags तयार गर्ने local helper। यो tool ले स्वतः social account मा publish गर्दैन र fact verification गर्दैन।</p></section><section class="layout"><div class="panel"><h2>POST DETAILS</h2><div class="field"><label for="platform">PLATFORM</label><select id="platform"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>YouTube Shorts</option></select></div><div class="field"><label for="kind">POST TYPE</label><select id="kind"><option>News photo post</option><option>Breaking news</option><option>Video / Reel</option><option>Interview / Talk show</option><option>General update</option></select></div><div class="field"><label for="topic">NEWS / VIDEO DETAILS</label><textarea id="topic" placeholder="समाचारको मुख्य तथ्य यहाँ लेख्नुहोस्…"></textarea></div><div class="field"><label for="keywords">KEYWORDS (COMMA SEPARATED)</label><input id="keywords" placeholder="Nepal, News, Politics"></div><button class="btn" id="generate">GENERATE CAPTION</button></div><div class="panel"><h2>READY TO COPY</h2><div class="field"><label for="title">SHORT TITLE</label><input id="title" placeholder="शीर्षक"></div><div class="field"><label for="caption">CAPTION</label><textarea id="caption" placeholder="Caption यहाँ तयार हुनेछ…"></textarea></div><div class="field"><label for="tags">HASHTAGS</label><textarea id="tags" placeholder="#NepalNews #BreakingNews"></textarea></div><div class="row"><button class="btn" id="all">COPY ALL</button><button class="btn secondary" id="copy">COPY CAPTION</button><button class="btn secondary" id="copyTags">COPY TAGS</button></div><p class="status" id="status" role="status"></p></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);function build(){const topic=$('topic').value.trim();if(!topic){$('status').textContent='पहिले विषय लेख्नुहोस्।';return}const first=topic.split(/[।.!?\n]/)[0].slice(0,90),platform=$('platform').value,kind=$('kind').value;$('title').value=first;$('caption').value=(kind==='Breaking news'?'BREAKING NEWS: ':kind==='News photo post'?'मुख्य समाचार: ':'')+topic+(platform==='Facebook'?'\n\nथप अपडेटका लागि Follow गर्नुहोस्।':'\n\nथप जानकारीका लागि जोडिइरहनुहोस्।');const tags=$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>'#'+x.replace(/\s+/g,''));$('tags').value=(tags.length?tags:['#NepalNews','#BreakingNews','#NewsUpdate']).join(' ');$('status').textContent='Caption तयार भयो। प्रकाशनअघि तथ्य जाँच गर्नुहोस्।'}async function copy(v){if(!v.trim()){$('status').textContent='Copy गर्न सामग्री छैन।';return}try{await navigator.clipboard.writeText(v);$('status').textContent='Copied.'}catch(e){$('status').textContent='Clipboard उपलब्ध छैन — text select गरेर copy गर्नुहोस्।'}}$('generate').onclick=build;$('copy').onclick=()=>copy($('caption').value);$('copyTags').onclick=()=>copy($('tags').value);$('all').onclick=()=>copy('TITLE\n'+$('title').value+'\n\nCAPTION\n'+$('caption').value+'\n\nHASHTAGS\n'+$('tags').value)})();
</script></body></html>
